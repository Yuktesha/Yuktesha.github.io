<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Jason Transformer v2.1</title>
<style>
body {
  font-family: sans-serif;
  background: #f5f6fa;
  margin: 0;
  padding: 20px;
}
.header {
  display: flex;
  justify-content: space-between;
  background: #fff;
  padding: 15px;
  border-radius: 8px;
}
.btn {
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  margin-left: 5px;
}
.btn-gray { background: #dfe4ea; }
.btn-gray.active { background: #0984e3; color: #fff; }
.btn-green { background: #2ecc71; color: #fff; }
.drop-zone {
  border: 3px dashed #a4b0be;
  background: #fff;
  border-radius: 8px;
  padding: 50px 20px;
  text-align: center;
  cursor: pointer;
  margin-top: 20px;
}
.view-panel { display: none; }
.view-panel.active { display: block; }

.table-wrapper {
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.05);
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  table-layout: auto;
  background: #fff;
}
th, td {
  border: 1px solid #ddd;
  padding: 10px 14px;
  text-align: left;
}
th {
  background-color: #f8fafc;
  position: sticky;
  top: 0;
  color: #4a5568;
  z-index: 10;
}
.th-input {
  border: 1px dashed #0984e3;
  background: #fff;
  padding: 4px 8px;
  font-size: 14px;
  font-weight: bold;
  border-radius: 4px;
  color: #2c3e50;
  width: 90%;
  box-sizing: border-box;
}
.th-input:focus {
  border-style: solid;
  background: #ebf8ff;
  outline: none;
}
.nw {
  white-space: nowrap;
}
.card-container {
  display: grid;
  gap: 20px;
  margin-top: 20px;
}
.card-container.grid-mode {
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
}
.card {
  border: 1px solid #ddd;
  background: #fff;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.02);
}
.single-wrapper {
  max-width: 600px;
  margin: 30px auto;
}
.nav-bar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  margin-top: 20px;
}
.nav-input {
  width: 60px;
  text-align: center;
  padding: 5px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 4px;
}
</style>
</head>
<body>

<div class="header">
  <h2 style="margin:0;">🚀 Jason Transformer</h2>
  <div id="ctl-box" style="display:none;">
    <button class="btn btn-gray active" id="b-tab" onclick="go('table')">表格</button>
    <button class="btn btn-gray" id="b-crd" onclick="go('cards')">卡片牆</button>
    <button class="btn btn-gray" id="b-sgn" onclick="go('single')">單一磚</button>
    <button class="btn btn-green" onclick="saveCSV()">下載 CSV</button>
  </div>
</div>

<div class="drop-zone" id="dz" onclick="document.getElementById('fi').click()">
  <h2 style="color:#0984e3;margin:0;">[ 📁 點擊或拖曳任何 JSON 檔案至此 ]</h2>
  <input type="file" id="fi" accept=".json" onchange="loadF(event)">
</div>

<h3 id="meta" style="margin:15px 0; display:none; color:#57606f;"></h3>

<div id="p-tab" class="view-panel">
  <div class="table-wrapper">
    <table id="tb">
      <thead id="th-box"></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div id="p-crd" class="view-panel">
  <div class="card-container grid-mode" id="cg"></div>
</div>

<div id="p-sgn" class="view-panel">
  <div class="single-wrapper">
    <div id="single-card-box"></div>
    <div class="nav-bar">
      <button class="btn btn-gray" onclick="movePage(-1)">&lt;</button>
      <div>
        <input type="text" id="cur-idx" class="nav-input" onkeydown="jumpPage(event)">
        <span id="total-idx">/ 0</span>
      </div>
      <button class="btn btn-gray" onclick="movePage(1)">&gt;</button>
    </div>
  </div>
</div>
<script>
let rawJson = null;
let listData = [];
let headers = [];
let curP = 0;
let isSingleMode = false;

const dz = document.getElementById("dz");

window.addEventListener("dragover",e=>e.preventDefault());
window.addEventListener("drop",e=>e.preventDefault());
dz.addEventListener("dragover",e=>e.preventDefault());
dz.addEventListener("drop",e=>{
  e.preventDefault();
  const fs = e.dataTransfer.files;
  if(fs.length>0) parse(fs[0]);
});

window.addEventListener("keydown", function(e) {
  if (!isSingleMode || listData.length===0) return;
  if (document.activeElement.className === "th-input") return;
  if (document.activeElement.id === "cur-idx") return;
  
  if (e.key === "ArrowLeft") movePage(-1);
  else if (e.key === "ArrowRight") movePage(1);
});

function loadF(e){
  const fs = e.target.files;
  if(fs.length>0) parse(fs[0]);
}

function parse(f){
  if (!f) return;
  const r = new FileReader();
  r.onload = (evt)=>{
    try{
      rawJson = JSON.parse(evt.target.result);
      processJsonGeneric();
    }catch(err){
      alert("解析失敗，確認檔案為標準JSON！");
    }
  };
  r.readAsText(f);
}

function processJsonGeneric() {
  listData = [];
  headers = [];
  
  let targetArray = null;
  if (Array.isArray(rawJson)) {
    targetArray = rawJson;
  } else {
    for (let k in rawJson) {
      if (Array.isArray(rawJson[k])) {
        targetArray = rawJson[k];
        break;
      }
    }
  }
  
  if (!targetArray || targetArray.length === 0) {
    alert("找不到可轉換的陣列資料！");
    return;
  }
  
  function flatten(obj, res = {}, prefix = "") {
    for (let k in obj) {
      let p = prefix ? prefix + "." + k : k;
      if (obj[k] !== null && typeof obj[k] === "object" && !Array.isArray(obj[k])) {
        flatten(obj[k], res, p);
      } else {
        res[p] = obj[k] === null ? "" : obj[k];
      }
    }
    return res;
  }
  
  let keysSet = new Set();
  targetArray.forEach(item => {
    let flatObj = flatten(item);
    listData.push(flatObj);
    Object.keys(flatObj).forEach(k => keysSet.add(k));
  });
  
  headers = Array.from(keysSet);
  run();
}
function run(){
  dz.style.display = "none";
  document.getElementById("ctl-box").style.display = "block";
  
  const m = document.getElementById("meta");
  m.style.display = "block";
  m.innerText = "資料載入成功｜通用自適應模式開啟";
  
  document.getElementById("total-idx").innerText = "/ " + listData.length;
  
  makeDynamicTable();
  makeC(listData);
  go("table");
}

function go(m){
  document.getElementById("p-tab").className="view-panel";
  document.getElementById("p-crd").className="view-panel";
  document.getElementById("p-sgn").className="view-panel";
  document.getElementById("b-tab").className="btn btn-gray";
  document.getElementById("b-crd").className="btn btn-gray";
  document.getElementById("b-sgn").className="btn btn-gray";
  isSingleMode = false;
  
  if(m==="table"){
    document.getElementById("p-tab").className="view-panel active";
    document.getElementById("b-tab").className="btn btn-gray active";
  }else if(m==="cards"){
    document.getElementById("p-crd").className="view-panel active";
    document.getElementById("b-crd").className="btn btn-gray active";
  }else if(m==="single"){
    document.getElementById("p-sgn").className="view-panel active";
    document.getElementById("b-sgn").className="btn btn-gray active";
    isSingleMode = true;
    showSingleBrick();
  }
}

function makeDynamicTable() {
  const thead = document.getElementById("th-box");
  thead.innerHTML = "";
  const tr = document.createElement("tr");
  
  headers.forEach((h, idx) => {
    const th = document.createElement("th");
    th.className = "nw";
    
    const input = document.createElement("input");
    input.type = "text";
    input.value = h;
    input.className = "th-input";
    input.id = "h-in-" + idx;
    
    th.appendChild(input);
    tr.appendChild(th);
  });
  thead.appendChild(tr);
  
  const tbody = document.querySelector("#tb tbody");
  tbody.innerHTML = "";
  listData.forEach(row => {
    const trData = document.createElement("tr");
    headers.forEach(h => {
      const td = document.createElement("td");
      td.innerText = row[h] !== undefined ? row[h] : "";
      trData.appendChild(td);
    });
    tbody.appendChild(trData);
  });
}

function getCardDom(i){
  const c = document.createElement("div");
  c.className = "card";
  c.style.borderTop = "5px solid #0984e3";
  
  const h = document.createElement("div");
  h.innerText = "資料項次 #" + (listData.indexOf(i) + 1);
  h.style.fontSize = "12px";
  h.style.color = "#95a5a6";
  c.appendChild(h);
  
  let count = 0;
  for (let key in i) {
    if (count > 4) break;
    const itemDiv = document.createElement("div");
    itemDiv.style.marginTop = "8px";
    itemDiv.innerHTML = "<b>" + key + ":</b> " + i[key];
    c.appendChild(itemDiv);
    count++;
  }
  return c;
}

function showSingleBrick(){
  if(listData.length===0) return;
  const box = document.getElementById("single-card-box");
  box.innerHTML = "";
  const item = listData[curP];
  box.appendChild(getCardDom(item));
  document.getElementById("cur-idx").value = curP + 1;
}

function movePage(step){
  let nextP = curP + step;
  if(nextP >= 0 && nextP < listData.length){
    curP = nextP;
    showSingleBrick();
  }
}

function jumpPage(e){
  if(e.key === "Enter"){
    let val = parseInt(e.target.value);
    if(!isNaN(val) && val >= 1 && val <= listData.length){
      curP = val - 1;
      showSingleBrick();
      document.getElementById("cur-idx").blur();
    }else{
      alert("請輸入有效的頁數！");
      e.target.value = curP + 1;
    }
  }
}

function makeC(h){
  const g = document.getElementById("cg");
  g.innerHTML = "";
  h.forEach(i=>{
    g.appendChild(getCardDom(i));
  });
}

function saveCSV(){
  if(listData.length === 0) return;
  let csvStr = "\uFEFF";
  let headArr = [];
  for (let i = 0; i < headers.length; i++) {
    let inp = document.getElementById("h-in-" + i);
    let txt = inp ? inp.value : headers[i];
    let safeTxt = txt.replace(/"/g, '""');
    headArr.push('"' + safeTxt + '"');
  }
  csvStr += headArr.join(",") + "\n";
  
  for (let r = 0; r < listData.length; r++) {
    let rowObj = listData[r];
    let lineArr = [];
    for (let c = 0; c < headers.length; c++) {
      let key = headers[c];
      let rawVal = rowObj[key];
      let strVal = rawVal !== undefined ? String(rawVal) : "";
      let safeVal = strVal.replace(/"/g, '""');
      lineArr.push('"' + safeVal + '"');
    }
    csvStr += lineArr.join(",") + "\n";
  }
  
  const blobObj = new Blob([csvStr], { type: "text/csv;charset=utf-8;" });
  const dlUrl = URL.createObjectURL(blobObj);
  const dlLink = document.createElement("a");
  dlLink.href = dlUrl;
  dlLink.download = "Jason_Transformer_Output.csv";
  document.body.appendChild(dlLink);
  dlLink.click();
  document.body.removeChild(dlLink);
}
</script>
</body>
</html>
